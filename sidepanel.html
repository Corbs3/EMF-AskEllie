<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Ellie</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <h1 class="brand"><span class="b-tech">Ask</span> <span class="b-bio">Ellie</span></h1>
    <div class="top-btns">
      <span class="theme-toast" id="theme-toast" role="status"></span>
      <button class="btn-round" id="theme-btn" aria-label="Theme: auto"></button>
      <button class="btn-round" id="settings-btn" aria-label="Custom terms"></button>
    </div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="ellie-wrap" id="ellie-wrap"></div>
    <p class="bubble" id="bubble"></p>
  </section>

  <section class="lookup" id="lookup" hidden aria-label="Look up">
    <div class="lk-head">
      <span class="lk-title">You looked up <q id="lk-text"></q></span>
      <button class="lk-close" id="lk-close" aria-label="Close look up"></button>
    </div>
    <div id="lk-body"></div>
  </section>

  <ol class="stages" id="stages" aria-label="Life stage"></ol>

  <div class="wings" id="wings" hidden>
    <div class="wingm bio">
      <div class="wingm-top"><span>Biological wing</span><b id="bio-n">0</b></div>
      <div class="bar"><div class="fill" id="bio-fill"></div></div>
    </div>
    <div class="wingm tech">
      <div class="wingm-top"><span>Technical wing</span><b id="tech-n">0</b></div>
      <div class="bar"><div class="fill" id="tech-fill"></div></div>
    </div>
    <p class="just-fun">Life stages are just for fun, not a real measure of circularity.</p>
  </div>

  <div class="scan-row">
    <button class="btn-main" id="scan-btn"></button>
  </div>

  <div class="chips" id="chips" role="toolbar" aria-label="Filter terms" hidden></div>

  <ul class="terms" id="terms"></ul>

  <div class="flutter" id="flutter" aria-hidden="true"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
